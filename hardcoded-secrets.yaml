rules:
  - id: hardcoded-secret-assignment
    languages: [python]
    severity: ERROR
    message: >
      A secret-looking variable is assigned a hardcoded string literal.
      Move this to an environment variable so it isn't committed to source.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(.*_(API_KEY|SECRET|SECRET_KEY|TOKEN|PASSWORD|PASSWD))$
      - pattern-not: $NAME = ""
